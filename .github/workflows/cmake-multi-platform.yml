name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu GCC"
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - name: "Ubuntu Clang"
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - name: "macOS Clang"
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - name: "Windows MSVC"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Cache JUCE source to avoid re-cloning on every run
      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.juce-deps
          key: juce-7.0.12-${{ runner.os }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libjack-jackd2-dev \
            libfontconfig1-dev

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.juce-deps
          -S .

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.juce-deps
          -S .

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure
